server.port=9999

# ── Active profile: local secrets loaded from application-local.properties ──
spring.profiles.active=local

spring.datasource.url=jdbc:mysql://localhost:3306/artistsion?characterEncoding=UTF8&autoReconnect=true&serverTimezone=Asia/Shanghai&allowMultiQueries=true&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}


mybatis-plus.global-config.db-config.logic-delete-field=deleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0
mybatis-plus.type-aliases-package=com.lf.entity



logging.level.com.lf.dao=debug


spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=1024MB

images.path = D:/images/
file.public-base-url=http://localhost:9999



#Redis
spring.redis.database=0
spring.redis.host=localhost
spring.redis.port=6379

#alipay
alipay.appId=${ALIPAY_APP_ID:}
alipay.privateKey=${ALIPAY_PRIVATE_KEY:}
alipay.publicKey=${ALIPAY_PUBLIC_KEY:}
alipay.notifyUrl=http://localhost:8888/#/order/ordergl
alipay.returnUrl=http://localhost:8888/#/order/ordergl
alipay.signType=RSA2
alipay.charset=utf-8
alipay.gatewayUrl=https://openapi-sandbox.dl.alipaydev.com/gateway.do
alipay.logPath="D:\"



ai.api.key=${AI_API_KEY:}

# JWT
jwt.secret=${JWT_SECRET:123456}

# Email (SMTP)
spring.mail.host=smtp.qq.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
